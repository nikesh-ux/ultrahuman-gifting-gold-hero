};

  const sh=g('--sh'),hi=g('--hi'),tint=g('--tint'),u=w/100;

 }
}

function scan(){document.querySelectorAll('canvas.mc-gl:not([data-ok])').forEach(c=>{c.dataset.ok=1;init(c)})}
scan();new MutationObserver(()=>requestAnimationFrame(scan)).observe(document.body,{childList:true,subtree:true});
})();


/*MC-JS-END*/
let cur=1,raf=0;
function play(v){
 cancelAnimationFrame(raf);cur=v||cur;
 const slot=document.getElementById('slot');
 slot.querySelectorAll('canvas').forEach(c=>{try{const g=c.getContext('webgl');g&&g.getExtension('WEBGL_lose_context')&&g.getExtension('WEBGL_lose_context').loseContext()}catch(e){}});
 slot.innerHTML=HERO.replace('data-v="1"','data-v="'+cur+'"');
 document.querySelectorAll('#pick button[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));
 document.getElementById('note').textContent=NAMES[cur-1]+'. '+DESC[cur-1];
 const hx=slot.querySelector('.hx');
 /* start the timeline only once every card has drawn (so nothing pops in half-ready) */
 let tries=0;
 (function wait(){
  const cs=[...hx.querySelectorAll('.mc')];
  if(cs.length===5&&cs.every(c=>c.__lit)||tries++>80){
   const go=()=>{hx.classList.add('go');sweep(hx)};
   (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(go,120));return}
  requestAnimationFrame(wait)})();
}
/* light band slides across the gold metal while it moves in */
function sweep(hx){
 const s0=SWEEP[cur-1];if(!s0)return;
 const g=hx.querySelectorAll('.mc')[2];if(!g||!g.__lit)return;
 const L=g.__lit,t0=performance.now(),delay=150,dur=1900;
 (function f(){
  const k=Math.max(0,Math.min(1,(performance.now()-t0-delay)/dur)),e=1-Math.pow(1-k,3);
  L.st.tx=s0*(1-e);L.st.h=.55*(1-e);L.render();
  if(k<1)raf=requestAnimationFrame(f)})();
}
document.getElementById('pick').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)play(+b.dataset.i)});
document.getElementById('re').addEventListener('click',()=>play());
document.getElementById('slot').addEventListener('click',()=>play());
play(1);
