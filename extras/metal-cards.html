*{box-sizing:border-box;margin:0}
html{background:#fff}
body{background:#fff;color:#0b0b0d;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{display:flex;justify-content:space-between;padding:28px clamp(20px,5.5vw,88px);font:400 11px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.5)}

/* ===== card shell (flat) ===== */
.card{position:relative;width:100%;aspect-ratio:1.64;border-radius:12px;container-type:inline-size;overflow:hidden;isolation:isolate;background:var(--base);
 box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 28px -14px rgba(0,0,0,.28)}
.card>*{position:absolute}
.fx{inset:0;pointer-events:none}
.grain{background:var(--fine);background-size:400px;mix-blend-mode:overlay;opacity:.32}
.rim{display:none;inset:0;border-radius:inherit;box-shadow:inset 4px 4px 10px -6px rgba(var(--edgeL,255,255,255),.5),inset -4px -4px 10px -6px rgba(0,0,0,.22)}
.rim::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,rgba(var(--edgeL,255,255,255),.95) 0%,rgba(var(--edgeL,255,255,255),.45) 22%,rgba(var(--edgeL,255,255,255),.08) 48%,rgba(0,0,0,0) 62%,rgba(0,0,0,.28) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}

.stage{perspective:900px;perspective-origin:50% 50%}
.stage .card{will-change:transform;backface-visibility:hidden}
.gl{inset:0;width:100%;height:100%;display:block}
/* ===== metal front (layout from the Figma card) ===== */
.t1{font:italic 600 6.7cqw/.9 "Barlow Condensed","Geist",sans-serif;letter-spacing:-.02em;text-transform:uppercase;color:var(--tint);text-shadow:.1cqw .12cqw 0 color-mix(in srgb,var(--hi) 30%,transparent),-.08cqw -.09cqw 0 color-mix(in srgb,var(--sh) 30%,transparent)}
.t2{font:500 2.35cqw/1.35 "Geist Mono",monospace;letter-spacing:-.03em;text-transform:uppercase;color:var(--tint);text-shadow:.1cqw .12cqw 0 color-mix(in srgb,var(--hi) 30%,transparent),-.08cqw -.09cqw 0 color-mix(in srgb,var(--sh) 30%,transparent);white-space:nowrap}
.emb{background:var(--embfill);filter:drop-shadow(-.2cqw -.2cqw 0 var(--hi)) drop-shadow(.25cqw .35cqw .25cqw var(--lo)) drop-shadow(.1cqw .12cqw 0 var(--lo))}
.mk{right:6cqw;top:5.4cqw;width:8.2cqw;height:8.2cqw}
.wm{left:1.7cqw;width:96.6cqw;height:8.83cqw;bottom:2.2cqw}
.etch>b{position:absolute;inset:0;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.etch.mk{--m:var(--mk)}.etch.wm{--m:var(--wm)}
.etch .s{background:var(--sh);opacity:.3;transform:translate(-.08cqw,-.09cqw)}
.etch .h{background:var(--hi);opacity:.3;transform:translate(.1cqw,.12cqw)}
.etch .f{background:var(--tint)}
/* icon: same cut-in look on every finish (light metals need a lighter fill and firmer edges) */
.etch.mk .f{opacity:var(--mkf,1)}
.etch.mk .s{opacity:var(--mks,.3)}
.etch.mk .h{opacity:var(--mkh,.3)}
.si,.au,.sv{--mkf:.58;--mks:.68;--mkh:.7}
.etch.mk .s{transform:translate(-.105cqw,-.12cqw)}
.etch.mk .h{transform:translate(.125cqw,.155cqw)}
.etch.wm .f{opacity:.095}
.etch.wm .s,.etch.wm .h{opacity:.04}
/* finishes: hard specular bands over a banded metal body for real highlights and weight */

.sv{--base:linear-gradient(112deg,#8a8b8f 0%,#aeafb3 20%,#d6d7da 30%,#b9babe 42%,#8e8f94 60%,#a8a9ad 78%,#8a8b8f 100%);--edgeL:255,255,255;--sh:rgba(30,32,38,.5);--floor:rgba(40,42,48,.16);--tint:rgba(34,36,42,.5);--hi:rgba(255,255,255,.88);--lo:rgba(16,18,24,.4);--embfill:rgba(30,31,35,.08)}

</div>
</main><script>
window.LINE=0;
(function(){
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uRes;uniform float uDpr;uniform vec3 uDark,uMid,uLight;uniform float uFringe,uStrength,uQ0,uLine,uEdgeS,uRim,uGrain;uniform vec3 uEdgeC;uniform vec2 uTilt;uniform float uHolo;
float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
/* strong core, long soft tails so the sides fade out gently */
float prof(float x,float w){return (0.66*exp(-pow(x/w,2.))+0.26*exp(-pow(x/(w*2.6),2.))+0.08*exp(-pow(x/(w*5.),2.)));}

void main(){
 vec2 fc=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
 vec2 uv=fc/uRes; vec2 p=(uv-.5)*vec2(uRes.x/uRes.y,1.);
 float ang=radians(-27.+uTilt.x*9.-uTilt.y*5.); vec2 dir=vec2(cos(ang),sin(ang)); vec2 nrm=vec2(-dir.y,dir.x);
 float q=dot(p,nrm), along=dot(p,dir);
 float qs=uQ0+uTilt.x*0.42+uTilt.y*0.14;
 /* broad lighting: soft lift toward the streak, falloff beyond it */
 float s1=smoothstep(-0.75,qs,q), s2=smoothstep(qs+0.02,0.62,q);
 vec3 col=mix(uMid,uLight,s1*0.55); col=mix(col,uDark,s2*0.88);
 col*=1.0+0.05*sin(along*2.2);
 /* the light band with colour fringing: red leads on one side, blue on the other */
 float w=0.095*(1.+0.4*uHolo), dsp=0.022*uFringe;
 float bR=prof(q-qs-dsp,w), bG=prof(q-qs,w), bB=prof(q-qs+dsp,w);
 float mod=0.8+0.2*sin(along*3.1+0.6);
 vec3 band=vec3(bR*1.0,bG*0.92,bB*1.0);
 col+=band*uStrength*mod;
 float glow=exp(-pow((q-qs)/(w*3.8*(1.+0.45*uHolo)),2.));
 col+=glow*uStrength*0.2*uLight;
 float glow2=exp(-pow((q-qs-0.34)/0.2,2.));col+=glow2*uStrength*0.07*uLight;
 /* holographic film: thin-film hues that slide across the metal as the card turns, mostly inside the lit band */
 if(uHolo>0.001){
  float ph=(q-qs)*1.5+along*0.35+uTilt.x*0.9+uTilt.y*0.5;
  vec3 hue=0.5+0.5*cos(6.2832*(ph+vec3(0.0,0.33,0.67)));
  float zone=exp(-pow((q-qs)/(0.45+0.75*uHolo),2.))*0.9;
  col=mix(col,col*0.55+hue*0.6*mix(vec3(1.),uLight,.45),uHolo*zone*0.13);
  col+=hue*uHolo*zone*0.015;
 }
 /* fine grooves: the ridges catch the light and shimmer most inside the band */
 if(uLine>0.5){
  float pitch=2.0*uDpr; float tt;
  if(uLine<1.5) tt=fc.x/pitch; else if(uLine<2.5) tt=fc.y/pitch; else tt=(fc.x+fc.y)*0.70711/pitch;
  float f=fract(tt);
  float ridge=smoothstep(0.0,0.28,f)*(1.-smoothstep(0.3,0.58,f));
  float groove=smoothstep(0.55,0.78,f)*(1.-smoothstep(0.84,1.0,f));
  float bm=clamp(bG*1.1+glow*0.9,0.,1.);
  col*=1.0-0.07*groove;
  col+=uLight*0.055*ridge*(0.35+0.9*bm);
 }
 /* glassy lit edge: top-left catches the light, bottom-right falls away */
 vec2 px=fc-uRes*.5, hs=uRes*.5; float r=12.*uDpr; float d=sdRB(px,hs,r);
 vec2 e=vec2(1.,0.);
 vec2 n=normalize(vec2(sdRB(px+e,hs,r)-sdRB(px-e,hs,r),sdRB(px+e.yx,hs,r)-sdRB(px-e.yx,hs,r))+1e-5);
 float lit=clamp(dot(n,normalize(vec2(-1.-uTilt.x*1.1,-1.-uTilt.y*1.1)))*.5+.5,0.,1.);
 float edge=smoothstep(-1.5*uDpr,-1.0*uDpr,d)*(1.-smoothstep(-0.4*uDpr,0.2*uDpr,d));
 float bn=exp(-pow((q-qs)/(0.3+0.25*uHolo),2.));
 col+=edge*pow(lit,1.6)*uEdgeC*uEdgeS*mix(1.,0.3+1.0*bn,uHolo);
 if(uHolo>0.001){vec3 eh=0.5+0.5*cos(6.2832*(dot(n,vec2(.7,.7))*.6+uTilt.x*.5+vec3(0.,.33,.67)));col+=edge*pow(lit,2.2)*eh*uHolo*0.12*bn;}

 col=mix(col,col*0.62,edge*(1.-lit)*0.7*(1.-0.6*uHolo));
 /* fine sandy grain, kept low: a soft stipple that reads as metal, not noise */
 float g=(hash(fc)*0.78+hash(floor(fc/uDpr)+17.3)*0.22)-0.5;
 col*=1.0+g*uGrain;
 col+=(hash(fc+3.1)-.5)/255.;
 gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;
const P={
 rose:{dark:[.60,.38,.33],mid:[.80,.61,.54],light:[.96,.84,.78],fr:1.5,st:.25,q0:-.02,ec:[.96,.84,.78],es:.9,rim:.12,gr:.035},
 gold:{dark:[.60,.48,.28],mid:[.80,.68,.46],light:[.96,.89,.70],fr:1.5,st:.25,q0:-.02,ec:[.96,.89,.70],es:.9,rim:.12,gr:.035},
 silver:{dark:[.50,.51,.55],mid:[.73,.74,.77],light:[.91,.91,.94],fr:1.4,st:.2,q0:-.02,ec:[1.0,1.0,1.0],es:.9,rim:0,gr:.03},
 black:{dark:[.045,.045,.05],mid:[.125,.125,.135],light:[.42,.42,.44],fr:.2,st:.24,q0:-.02,ec:[.82,.82,.84],es:1.0,rim:0,gr:.05}
};
function init(c){
 const card=c.parentElement, pr=P[card.dataset.metal]; if(!pr)return;
 const gl=c.getContext('webgl',{antialias:true,premultipliedAlpha:false}); if(!gl)return;
 function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
 const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
 if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(prog));return}

 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

 const st={tx:0,ty:0,h:0};
 function size(){
  const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(2,Math.round(card.clientWidth*dpr)),h=Math.max(2,Math.round(card.clientHeight*dpr));

  gl.uniform3fv(U('uDark'),pr.dark);gl.uniform3fv(U('uMid'),pr.mid);gl.uniform3fv(U('uLight'),pr.light);

  render();
 }
 function render(){
  gl.uniform2f(U('uTilt'),st.tx,st.ty);gl.uniform1f(U('uHolo'),st.h);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

 size(); (window.DRAWS=window.DRAWS||[]).push(size); if(window.ResizeObserver)new ResizeObserver(size).observe(card);
 /* hover: card turns toward the pointer, light and film follow */
 const stage=card.parentElement, MAXR=11, rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
 let tx=0,ty=0,gx=0,gy=0,raf=0,hov=false;
 function tick(){
  const k=hov?.12:.07;
  tx+=(gx-tx)*k;ty+=(gy-ty)*k;
  const hh=Math.min(1,Math.hypot(tx,ty)*1.15);
  st.tx=tx;st.ty=ty;st.h=hh;
  card.style.transform='rotateX('+(-ty*MAXR).toFixed(2)+'deg) rotateY('+(tx*MAXR).toFixed(2)+'deg)';
  card.style.boxShadow='0 2px 4px rgba(0,0,0,.12),'+(-tx*14).toFixed(1)+'px '+(18-ty*8).toFixed(1)+'px 28px -14px rgba(0,0,0,'+(.28+hh*.08).toFixed(2)+')';
  render();

 function go(){if(!raf)raf=requestAnimationFrame(tick)}
 if(!rm){
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();gx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));gy=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2));hov=true;go()});

}

document.querySelectorAll('canvas.gl').forEach(init);
})();
