<style>

:root{--gut:clamp(16px,3.4vw,56px)}
*{box-sizing:border-box;margin:0}
html,body{background:#fff}

.pick button b{font-weight:500;margin-right:5px;color:rgba(0,0,0,.45)}
.pick button.on{background:#000;color:#fff;border-color:#000}.pick button.on b{color:rgba(255,255,255,.6)}

/* ---- split hero ---- */
.sp{container-type:size;height:calc(100svh - 190px);min-height:560px;margin:0 var(--gut);display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(16px,2.2vw,40px);position:relative}

.pn .hx{width:min(88cqw,96cqh);aspect-ratio:664/639;margin:0;transform:translateY(3%);position:relative;overflow:visible;container-type:size;background:none;height:auto;flex:none}

/* 7 */ [data-v="7"]{grid-template-columns:1.08fr 1fr}[data-v="7"] .tx{padding:8% clamp(8px,2.4cqw,44px) 8% 0;justify-content:space-between}

function scan(){document.querySelectorAll('canvas.mc-gl:not([data-ok])').forEach(c=>{c.dataset.ok=1;init(c)})}
scan();new MutationObserver(()=>requestAnimationFrame(scan)).observe(document.body,{childList:true,subtree:true});
})();


/*MC-JS-END*/
function play(i){
 const slot=document.getElementById('slot');
 slot.querySelectorAll('canvas').forEach(c=>{try{const g=c.getContext('webgl');g&&g.getExtension('WEBGL_lose_context')&&g.getExtension('WEBGL_lose_context').loseContext()}catch(e){}});
 slot.innerHTML=HERO[i-1];
 document.querySelectorAll('#pick button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
 document.getElementById('note').textContent=String(i).padStart(2,'0')+' '+NAMES[i-1]+'. '+DESC[i-1];
 history.replaceState(null,'','#'+i);
}
document.getElementById('pick').addEventListener('click',e=>{const b=e.target.closest('button');if(b)play(+b.dataset.i)});
play(Math.min(10,Math.max(1,parseInt(location.hash.slice(1))||1)));
</script></body></html>
